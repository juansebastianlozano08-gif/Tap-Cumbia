
name: Build Cumbia Tap APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          mkdir source
          unzip -q CumbiaTapAndroid_proyecto.zip -d source

      - name: Build APK
        run: |
          cd source/CumbiaTapAndroid
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Cumbia-Tap-APK
          path: source/CumbiaTapAndroid/app/build/outputs/apk/debug/app-debug.apk
          
